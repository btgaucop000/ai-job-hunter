name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '12.14.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Configure disposable test database
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const password = randomBytes(24).toString('hex');
          console.log(`::add-mask::${password}`);
          writeFileSync('.env.test', [
            'NODE_ENV=test', 'DB_ENV=test', 'DB_HOST=127.0.0.1',
            'DB_PORT=5433', 'DB_NAME=ai_job_hunter_test',
            'DB_USER=ai_job_hunter_test', `DB_PASSWORD=${password}`, '',
          ].join('\n'), { mode: 0o600 });
          NODE
      - run: pnpm db:test:up
      - run: pnpm db:test:migrate:compiled
      - run: pnpm test:integration
      - name: Stop disposable test database
        if: always()
        shell: bash
        run: |
          if [ -f .env.test ]; then
            pnpm db:test:down
          fi
